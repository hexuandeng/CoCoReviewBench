# Local config for scripts/run_process_review.sh
# This file is sourced by bash.
# Edit this file directly; there is no separate example config.
# Keep the syntax as KEY="value" or KEY=value.
# Some fields may be left empty to use shell-derived defaults;
# fields with concrete defaults below are expected to stay configured here.

# Shared hosted API config for generation/evaluation.
# When `--is_vllm 0`, BASE_URL must be set.
BASE_URL=""
API_KEY=""
VLLM_BASE_URL="http://localhost:40000/v1"
# Shared GPU count for split/classify vLLM data parallel size.
GPU_NUM=4

# Positional defaults
# REVIEW_MODEL is passed as the first script argument, not configured here.
# Path or glob pattern. The default covers all benchmark_*_20*.jsonl files.
BENCHMARK_FILE="benchmark/benchmark_*_20*.jsonl"
# Leave empty to use the default result.jsonl / BENCHMARK_FILE flow.
SAMPLE_DATA_PATH=""

# Step 1: src/evaluation/_1_query_ai_reviewer.py
REVIEWER_NUM=1
REVIEW_MAX_WORKERS=256
REVIEW_TEMPERATURE=0.6
REVIEW_MAX_TOKENS=32768
REVIEW_MAX_INPUT_TOKENS=65536
REVIEW_NUM_FS_EXAMPLES=3
REVIEW_GENERAL_CONFIG=0

# Step 2/3: split + classify
SPLIT_MODEL="Qwen3-8B-Split"
CLASSIFY_MODEL="Qwen3-8B-Classify"
SPLIT_PORT=13099
CLASSIFY_PORT=13098
SPLIT_EFFORT="medium"
CLASSIFY_EFFORT="medium"
SPLIT_MAX_WORKERS=512
CLASSIFY_MAX_WORKERS=1024
CACHE_VERSION="v1"

# Step 4: src/evaluation/_4_evaluation.py
# EVAL_OUTPUT_FILE / EVAL_BENCHMARK_FILE are derived in the shell script.
EVAL_COMPLETE_HUMAN_CLASSIFY_FILE="benchmark/benchmark_all_human_classify.jsonl"
EVAL_MODEL="gpt-5-mini"
EVAL_MAX_WORKERS=1024
EVAL_EFFORT="medium"
